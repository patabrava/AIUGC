{# _blog_panel.html — Blog Posts Panel #}
{% set all_posts = batch_view.visible_posts if batch_view is defined and batch_view.visible_posts else [] %}
{% set blog_posts = all_posts | selectattr('blog_enabled') | list %}
{% if blog_posts %}
<div class="mt-6 rounded-xl border border-white/10 bg-[#1a1a2e] overflow-hidden"
     x-data="blogPanelComponent()"
     x-init="initPosts(JSON.parse($refs.blogData.textContent))"
     @script-review-updated.window="markScriptReview($event.detail)"
     id="blog-panel">
    <script type="application/json" x-ref="blogData">{{ blog_posts | tojson }}</script>

    <div class="flex items-center justify-between px-6 py-4 border-b border-white/10">
        <div class="flex items-center gap-3">
            <h3 class="text-base font-semibold text-gray-100">Blog Posts</h3>
            <span class="bg-[#006AAB]/20 text-[#006AAB]/80 text-xs font-semibold px-2 py-0.5 rounded-full"
                  x-text="posts.length + ' of {{ all_posts | length }} posts'"></span>
        </div>
        <button class="brand-button-primary inline-flex items-center gap-2 text-sm font-medium px-4 py-2 rounded-lg transition brand-focus text-white disabled:opacity-60 disabled:cursor-wait"
                type="button"
                :disabled="isGenerating || !posts.some(post => isScriptApproved(post))"
                :aria-busy="bulkAction === 'drafts' ? 'true' : 'false'"
                @click="generateAllDrafts()">
            <svg x-show="bulkAction === 'drafts'"
                 class="h-4 w-4 animate-spin"
                 viewBox="0 0 24 24"
                 fill="none"
                 aria-hidden="true">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
            </svg>
            <span x-text="bulkAction === 'drafts' ? 'Generating Drafts...' : 'Generate All Drafts'"></span>
        </button>
    </div>

    <template x-for="post in posts" :key="post.id">
        <div class="border-b border-white/5">
            <div class="flex items-center justify-between px-6 py-3 cursor-pointer hover:bg-white/5 transition"
                 @click="toggleExpand(post.id)">
                <div class="flex items-center gap-3 min-w-0 flex-1">
                    <span class="text-xs font-semibold px-2 py-0.5 rounded-full uppercase flex-shrink-0"
                          :class="{ 'bg-[#006AAB] text-white': post.post_type === 'value', 'bg-sky-500 text-white': post.post_type === 'lifestyle', 'bg-amber-500 text-white': post.post_type === 'product' }"
                          x-text="post.post_type"></span>
                    <span class="text-sm text-gray-200 truncate"
                          x-text="post.blog_content?.name || post.topic_title"></span>
                </div>
                <div class="flex items-center gap-3 flex-shrink-0">
                    <span class="text-xs font-semibold px-2 py-0.5 rounded-full"
                          :class="{ 'bg-green-500/15 text-green-400': effectiveStatus(post) === 'draft' || effectiveStatus(post) === 'published', 'bg-blue-500/15 text-blue-400': effectiveStatus(post) === 'scheduled', 'bg-amber-500/15 text-amber-400': effectiveStatus(post) === 'pending', 'bg-[#006AAB]/15 text-[#006AAB]/80': effectiveStatus(post) === 'generating' || effectiveStatus(post) === 'publishing', 'bg-red-500/15 text-red-400': effectiveStatus(post) === 'failed', }"
                          x-text="statusLabel(post)"></span>
                    <template x-if="isScriptApproved(post) && (effectiveStatus(post) === 'pending' || effectiveStatus(post) === 'failed')">
                        <button class="brand-button-primary inline-flex items-center gap-1.5 text-xs font-medium px-3 py-1 rounded transition brand-focus text-white"
                                type="button"
                                :disabled="isBusy(post)"
                                :aria-busy="isBusyFor(post, 'draft') ? 'true' : 'false'"
                                :class="isBusy(post) ? 'opacity-60 cursor-wait' : ''"
                                @click.stop="generateDraft(post.id)">
                            <svg x-show="isBusyFor(post, 'draft')"
                                 class="h-3.5 w-3.5 animate-spin"
                                 viewBox="0 0 24 24"
                                 fill="none"
                                 aria-hidden="true">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                            </svg>
                            <span x-text="isBusyFor(post, 'draft') ? 'Generating…' : 'Generate'"></span>
                        </button>
                    </template>
                    <span class="text-gray-500 text-sm" x-text="expanded === post.id ? '&#9660;' : '&#9654;'"></span>
                </div>
            </div>

            <template x-if="post.clientNote || post.blog_content?.error">
                <div class="px-6 pb-3 text-xs"
                     :class="effectiveStatus(post) === 'failed' ? 'text-red-300' : 'text-blue-300'"
                     x-text="post.clientNote || post.blog_content?.error"></div>
            </template>

            <template x-if="expanded === post.id && post.blog_content && post.blog_content.body_html">
                <div class="px-6 pb-5 space-y-6">
                    <div class="grid gap-4 md:grid-cols-2">
                        <div>
                            <label class="block text-xs text-gray-400 uppercase tracking-wide mb-1">Name</label>
                            <input type="text"
                                   class="w-full bg-[#0f0f1e] border border-white/10 rounded-lg px-3 py-2 text-sm text-gray-100 font-medium focus:border-[#006AAB] focus:outline-none"
                                   :value="post.blog_content.name"
                                   @blur="saveField(post.id, 'name', $event.target.value)">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 uppercase tracking-wide mb-1">Slug</label>
                            <input type="text"
                                   class="w-full bg-[#0f0f1e] border border-white/10 rounded-lg px-3 py-2 text-sm text-gray-100 focus:border-[#006AAB] focus:outline-none"
                                   :value="post.blog_content.slug"
                                   @blur="saveField(post.id, 'slug', $event.target.value)">
                        </div>
                    </div>

                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs text-gray-400 uppercase tracking-wide mb-1">Merksatz</label>
                            <input type="text"
                                   class="w-full bg-[#0f0f1e] border border-white/10 rounded-lg px-3 py-2 text-sm text-gray-100 focus:border-[#006AAB] focus:outline-none"
                                   :value="post.blog_content.merksatz"
                                   @blur="saveField(post.id, 'merksatz', $event.target.value)">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 uppercase tracking-wide mb-1">Tipp</label>
                            <input type="text"
                                   class="w-full bg-[#0f0f1e] border border-white/10 rounded-lg px-3 py-2 text-sm text-gray-100 focus:border-[#006AAB] focus:outline-none"
                                   :value="post.blog_content.tipp"
                                   @blur="saveField(post.id, 'tipp', $event.target.value)">
                        </div>
                    </div>

                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <label class="block text-xs text-gray-400 uppercase tracking-wide">Zusammenfassung</label>
                            <span class="text-xs text-gray-500">Rich text preview</span>
                        </div>
                        <div class="bg-[#0f0f1e] border border-white/10 rounded-lg px-4 py-4 text-sm text-gray-100 prose prose-invert max-w-none prose-p:my-3 prose-ul:my-3 prose-li:my-1 prose-headings:text-gray-100"
                             x-html="post.blog_content.summary_html"></div>
                    </div>

                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <label class="block text-xs text-gray-400 uppercase tracking-wide">Inhalt</label>
                            <span class="text-xs text-gray-500" x-text="(post.blog_content.word_count || 0) + ' words'"></span>
                        </div>
                        <div class="bg-[#0f0f1e] border border-white/10 rounded-lg px-4 py-4 text-sm text-gray-100 prose prose-invert max-w-none prose-p:my-3 prose-ul:my-3 prose-li:my-1 prose-headings:text-gray-100 max-h-[32rem] overflow-y-auto"
                             x-html="post.blog_content.body_html"></div>
                    </div>

                    <div class="rounded-lg border border-white/10 bg-[#0f0f1e] px-4 py-4">
                        <div class="flex items-start justify-between gap-3 flex-wrap">
                            <div>
                                <label class="block text-xs text-gray-400 uppercase tracking-wide">Veroeffentlichungsdatum</label>
                                <p class="mt-1 text-xs text-gray-500">Open the calendar, click a day, then fine-tune the time. All times are Europe/Berlin.</p>
                            </div>
                            <span class="text-xs font-semibold px-2 py-1 rounded-full bg-blue-500/15 text-blue-300 whitespace-nowrap"
                                  x-show="post.blog_scheduled_at"
                                  x-text="'Scheduled · ' + formatScheduled(post.blog_scheduled_at)"></span>
                        </div>

                        <div class="mt-3 flex flex-wrap items-end gap-3">
                            <div class="relative min-w-[16rem] flex-1 max-w-sm"
                                 @click.outside="if (calendarPostId === post.id) closeCalendar()"
                                 @keydown.escape.window="if (calendarPostId === post.id) closeCalendar()">
                                <label class="block text-[11px] text-gray-500 mb-1">Datum &amp; Uhrzeit</label>
                                <button class="w-full flex items-center justify-between gap-2 bg-[#0c0c18] border rounded-lg px-3 py-2 text-sm text-left transition focus:outline-none"
                                        type="button"
                                        aria-haspopup="dialog"
                                        :aria-expanded="isCalendarOpen(post) ? 'true' : 'false'"
                                        :class="isCalendarOpen(post) ? 'border-[#006AAB]' : 'border-white/10 hover:border-white/25'"
                                        @click="toggleCalendar(post)">
                                    <span :class="scheduleLocalValue(post) ? 'text-gray-100' : 'text-gray-500'"
                                          x-text="scheduleDisplayLabel(post)"></span>
                                    <svg class="h-4 w-4 flex-shrink-0 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                        <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                                        <path d="M3 10h18M8 3v4M16 3v4" stroke-linecap="round"></path>
                                    </svg>
                                </button>

                                <div class="absolute left-0 z-30 mt-2 w-[19rem] rounded-xl border border-white/10 bg-[#161629] p-3 shadow-2xl shadow-black/60"
                                     x-show="isCalendarOpen(post)"
                                     x-cloak
                                     x-transition.opacity.duration.120ms
                                     role="dialog"
                                     aria-label="Veroeffentlichungsdatum waehlen">
                                    <div class="flex items-center justify-between gap-2 pb-2">
                                        <button class="h-7 w-7 rounded-lg text-gray-300 hover:bg-white/10 hover:text-white transition"
                                                type="button"
                                                aria-label="Vorheriger Monat"
                                                @click="calendarShiftMonth(-1)">&#8249;</button>
                                        <span class="text-sm font-semibold text-gray-100" x-text="calendarMonthLabel()"></span>
                                        <button class="h-7 w-7 rounded-lg text-gray-300 hover:bg-white/10 hover:text-white transition"
                                                type="button"
                                                aria-label="Naechster Monat"
                                                @click="calendarShiftMonth(1)">&#8250;</button>
                                    </div>

                                    <div class="grid grid-cols-7 gap-1 pb-1">
                                        <template x-for="weekday in calendarWeekdays" :key="weekday">
                                            <span class="text-center text-[10px] font-semibold uppercase text-gray-500" x-text="weekday"></span>
                                        </template>
                                    </div>

                                    <div class="grid grid-cols-7 gap-1">
                                        <template x-for="day in calendarDays(post)" :key="day.value">
                                            <button class="h-8 rounded-lg text-xs transition"
                                                    type="button"
                                                    :disabled="day.disabled"
                                                    :class="day.isSelected ? 'bg-[#006AAB] text-white font-semibold'
                                                        : day.disabled ? 'text-gray-600 cursor-not-allowed'
                                                        : day.isToday ? 'border border-[#006AAB]/60 text-gray-100 hover:bg-white/10'
                                                        : day.outside ? 'text-gray-500 hover:bg-white/10'
                                                        : 'text-gray-200 hover:bg-white/10'"
                                                    @click="pickCalendarDay(post, day.value)"
                                                    x-text="day.label"></button>
                                        </template>
                                    </div>

                                    <div class="mt-3 border-t border-white/10 pt-3">
                                        <div class="flex items-center justify-between gap-2">
                                            <label class="text-[11px] uppercase tracking-wide text-gray-500">Uhrzeit</label>
                                            <div class="flex items-center gap-1">
                                                <select class="bg-[#0c0c18] border border-white/10 rounded-lg px-2 py-1 text-sm text-gray-100 focus:border-[#006AAB] focus:outline-none"
                                                        aria-label="Stunde"
                                                        :value="scheduleHour(post)"
                                                        @change="setScheduleHour(post, $event.target.value)">
                                                    <template x-for="hour in calendarHourOptions" :key="hour">
                                                        <option :value="hour" :selected="hour === scheduleHour(post)" x-text="hour"></option>
                                                    </template>
                                                </select>
                                                <span class="text-gray-500">:</span>
                                                <select class="bg-[#0c0c18] border border-white/10 rounded-lg px-2 py-1 text-sm text-gray-100 focus:border-[#006AAB] focus:outline-none"
                                                        aria-label="Minute"
                                                        :value="scheduleMinute(post)"
                                                        @change="setScheduleMinute(post, $event.target.value)">
                                                    <template x-for="minute in calendarMinuteOptions(post)" :key="minute">
                                                        <option :value="minute" :selected="minute === scheduleMinute(post)" x-text="minute"></option>
                                                    </template>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="mt-2 flex flex-wrap gap-1.5">
                                            <template x-for="chip in calendarTimeChips" :key="chip">
                                                <button class="text-[11px] font-medium px-2 py-1 rounded-lg border transition"
                                                        type="button"
                                                        :class="post.blogScheduleTime === chip ? 'border-[#006AAB] bg-[#006AAB]/20 text-white' : 'border-white/10 text-gray-300 hover:bg-white/5 hover:text-white'"
                                                        @click="pickCalendarTime(post, chip)"
                                                        x-text="chip"></button>
                                            </template>
                                        </div>
                                    </div>

                                    <div class="mt-3 flex items-center justify-between gap-2 border-t border-white/10 pt-3">
                                        <button class="text-xs text-gray-400 hover:text-white transition"
                                                type="button"
                                                @click="clearSchedulePick(post)">Zuruecksetzen</button>
                                        <button class="brand-button-primary text-xs font-medium px-3 py-1.5 rounded-lg transition brand-focus text-white"
                                                type="button"
                                                @click="closeCalendar()">Uebernehmen</button>
                                    </div>
                                </div>
                            </div>
                            <button class="inline-flex items-center gap-1.5 brand-button-primary text-xs font-medium px-4 py-2 rounded-lg transition brand-focus text-white disabled:opacity-50 disabled:cursor-not-allowed"
                                    type="button"
                                    :disabled="!canSchedule(post)"
                                    :aria-busy="isBusyFor(post, 'schedule') ? 'true' : 'false'"
                                    :title="scheduleIssue(post) || ''"
                                    @click="scheduleDraft(post)">
                                <svg x-show="isBusyFor(post, 'schedule')"
                                     class="h-3.5 w-3.5 animate-spin"
                                     viewBox="0 0 24 24"
                                     fill="none"
                                     aria-hidden="true">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                                </svg>
                                <span x-text="isBusyFor(post, 'schedule') ? 'Saving…' : (post.blog_scheduled_at ? 'Reschedule' : 'Schedule')"></span>
                            </button>
                        </div>

                        <div class="mt-3 flex flex-wrap items-center gap-2">
                            <span class="text-[11px] text-gray-500 uppercase tracking-wide">Quick pick</span>
                            <template x-for="preset in schedulePresets" :key="preset.key">
                                <button class="text-xs font-medium px-2.5 py-1 rounded-lg border border-white/10 text-gray-300 hover:bg-white/5 hover:text-white transition"
                                        type="button"
                                        @click="applySchedulePreset(post, preset.key)"
                                        x-text="preset.label"></button>
                            </template>
                        </div>

                        <p class="mt-3 text-xs"
                           :class="(post.blogScheduleDate || post.blogScheduleTime) ? 'text-amber-300' : 'text-gray-500'"
                           x-show="scheduleIssue(post) && !isBusyFor(post, 'schedule')"
                           x-text="scheduleIssue(post)"></p>
                        <p class="mt-3 text-xs text-gray-400"
                           x-show="!scheduleIssue(post) && !post.scheduleError && !post.scheduleNote"
                           x-text="'Publishes ' + formatScheduled(scheduleUtcDate(post))"></p>
                        <p class="mt-3 text-xs text-green-400" x-show="post.scheduleNote" x-text="post.scheduleNote"></p>
                        <p class="mt-3 text-xs text-red-300" x-show="post.scheduleError" x-text="post.scheduleError"></p>
                    </div>

                    <div class="grid gap-4 md:grid-cols-2">
                        <div>
                            <label class="block text-xs text-gray-400 uppercase tracking-wide mb-1">Vorschautext</label>
                            <textarea class="w-full bg-[#0f0f1e] border border-white/10 rounded-lg px-3 py-2 text-sm text-gray-100 focus:border-[#006AAB] focus:outline-none resize-y"
                                      rows="3"
                                      @blur="saveField(post.id, 'preview_text', $event.target.value)"
                                      x-text="post.blog_content.preview_text"></textarea>
                        </div>
                    </div>

                    <div class="grid gap-4 md:grid-cols-2">
                        <div>
                            <label class="block text-xs text-gray-400 uppercase tracking-wide mb-1">Lesedauer</label>
                            <input type="text"
                                   readonly
                                   class="w-full bg-[#0f0f1e] border border-white/10 rounded-lg px-3 py-2 text-sm text-gray-400 focus:outline-none"
                                   :value="post.blog_content.reading_time">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 uppercase tracking-wide mb-1">Autor</label>
                            <input type="text"
                                   placeholder="Exact Webflow option label"
                                   class="w-full bg-[#0f0f1e] border border-white/10 rounded-lg px-3 py-2 text-sm text-gray-100 focus:border-[#006AAB] focus:outline-none"
                                   :value="post.blog_content.author_name || ''"
                                   @blur="saveField(post.id, 'author_name', $event.target.value)">
                        </div>
                    </div>

                    <div class="grid gap-4 md:grid-cols-2">
                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs text-gray-400 uppercase tracking-wide mb-1">Bildprompt</label>
                                <textarea class="w-full bg-[#0f0f1e] border border-white/10 rounded-lg px-3 py-2 text-sm text-gray-100 focus:border-[#006AAB] focus:outline-none resize-y"
                                          rows="4"
                                          placeholder="Beschreibe das Bild, das generiert werden soll"
                                          x-model="post.blog_content.image_prompt"
                                          @blur="saveField(post.id, 'image_prompt', $event.target.value)"></textarea>
                                <div class="mt-2 flex gap-2 flex-wrap">
                                    <button class="text-xs font-medium px-3 py-1.5 rounded-lg brand-button-primary transition brand-focus text-white"
                                            type="button"
                                            :disabled="isBusy(post)"
                                            :class="isBusy(post) ? 'opacity-60 cursor-wait' : ''"
                                            @click="generateImage(post)">
                                        <span x-text="isBusyFor(post, 'image') ? 'Generating…' : 'Generate Image'"></span>
                                    </button>
                                    <button class="text-xs font-medium px-3 py-1.5 rounded-lg border border-white/10 text-gray-200 hover:bg-white/5 transition"
                                            type="button"
                                            :disabled="isBusy(post)"
                                            :class="isBusy(post) ? 'opacity-60 cursor-wait' : ''"
                                            @click="regenerateImage(post)">
                                        <span x-text="isBusyFor(post, 'image') ? 'Generating…' : 'Regenerate'"></span>
                                    </button>
                                    <button class="text-xs font-medium px-3 py-1.5 rounded-lg border border-red-500/30 text-red-300 hover:bg-red-500/10 transition"
                                            type="button"
                                            :disabled="isBusy(post)"
                                            :class="isBusy(post) ? 'opacity-60 cursor-wait' : ''"
                                            @click="removeImage(post)">
                                        <span x-text="isBusyFor(post, 'image') ? 'Working…' : 'Remove'"></span>
                                    </button>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs text-gray-400 uppercase tracking-wide mb-1">Meta-Titel</label>
                                <input type="text"
                                       class="w-full bg-[#0f0f1e] border border-white/10 rounded-lg px-3 py-2 text-sm text-gray-100 focus:border-[#006AAB] focus:outline-none"
                                       :value="post.blog_content.meta_title"
                                       @blur="saveField(post.id, 'meta_title', $event.target.value)">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-400 uppercase tracking-wide mb-1">Meta-Beschreibung</label>
                                <textarea class="w-full bg-[#0f0f1e] border border-white/10 rounded-lg px-3 py-2 text-sm text-gray-100 focus:border-[#006AAB] focus:outline-none resize-y"
                                          rows="3"
                                          @blur="saveField(post.id, 'meta_description', $event.target.value)"
                                          x-text="post.blog_content.meta_description"></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="grid gap-4 md:grid-cols-2">
                        <div class="bg-[#0f0f1e] border border-white/10 rounded-lg px-4 py-4">
                            <div class="flex items-center justify-between gap-2 mb-2">
                                <label class="block text-xs text-gray-400 uppercase tracking-wide">Bildvorschau</label>
                                <span class="text-xs text-gray-500" x-text="post.blog_content.image_model || 'Gemini'"></span>
                            </div>
                            <template x-if="post.blog_content.preview_image_url">
                                <img :src="post.blog_content.preview_image_url"
                                     alt="Generated blog preview"
                                     class="w-full max-h-80 rounded-lg border border-white/10 object-cover">
                            </template>
                            <template x-if="!post.blog_content.preview_image_url">
                                <div class="flex min-h-48 items-center justify-center rounded-lg border border-dashed border-white/10 text-sm text-gray-500">
                                    No preview image yet
                                </div>
                            </template>
                            <p class="mt-3 text-xs text-gray-400" x-text="post.blog_content.image_generated_at ? ('Generated at ' + post.blog_content.image_generated_at) : ''"></p>
                        </div>
                        <div class="bg-[#0f0f1e] border border-white/10 rounded-lg px-4 py-4">
                            <label class="block text-xs text-gray-400 uppercase tracking-wide mb-1">Accepted image URL</label>
                            <input type="url"
                                   class="w-full bg-[#0c0c18] border border-white/10 rounded-lg px-3 py-2 text-sm text-gray-100 focus:border-[#006AAB] focus:outline-none"
                                   :value="post.blog_content.preview_image_url || ''"
                                   @blur="saveField(post.id, 'preview_image_url', $event.target.value)">
                            <p class="mt-2 text-xs text-gray-500">This URL is what gets sent to Webflow as `vorschaubild`.</p>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs text-gray-400 uppercase tracking-wide mb-1">Sources (from dossier)</label>
                        <div class="bg-[#0f0f1e] border border-white/10 rounded-lg px-3 py-2 text-xs text-gray-400 leading-relaxed">
                            <template x-for="src in (post.blog_content.sources || []).filter(s => s && s.url && !s.url.includes('vertexaisearch.cloud.google.com'))" :key="src.url">
                                <a :href="src.url" target="_blank" rel="noopener noreferrer"
                                   class="block text-[var(--lippe-blue)] hover:text-[#006AAB]/80 hover:underline cursor-pointer"
                                   x-text="'• ' + src.title"></a>
                            </template>
                        </div>
                    </div>

                    <div class="flex items-center justify-between gap-3 flex-wrap">
                        <div class="flex gap-2">
                            <button class="inline-flex items-center gap-1.5 text-[var(--lippe-blue)] border border-[var(--lippe-blue)] border-opacity-30 text-xs font-medium px-3 py-1.5 rounded-lg hover:bg-[var(--lippe-blue)] hover:bg-opacity-10 transition"
                                    type="button"
                                    :disabled="isBusy(post)"
                                    :aria-busy="isBusyFor(post, 'draft') ? 'true' : 'false'"
                                    :class="isBusy(post) ? 'opacity-60 cursor-wait' : ''"
                                    @click="generateDraft(post.id)">
                                <svg x-show="isBusyFor(post, 'draft')"
                                     class="h-3.5 w-3.5 animate-spin"
                                     viewBox="0 0 24 24"
                                     fill="none"
                                     aria-hidden="true">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                                </svg>
                                <span x-text="isBusyFor(post, 'draft') ? 'Regenerating…' : 'Regenerate Draft'"></span>
                            </button>
                        </div>
                        <div class="flex items-center gap-2">
                            <template x-if="post.blog_webflow_item_id">
                                <button class="brand-button-primary text-xs font-medium px-3 py-1.5 rounded-lg transition brand-focus text-white"
                                        type="button"
                                        :disabled="isBusy(post)"
                                        :class="isBusy(post) ? 'opacity-60 cursor-wait' : ''"
                                        @click="publishNow(post.id)">
                                    <span x-text="isBusyFor(post, 'publish') ? 'Publishing…' : 'Update on Webflow'"></span>
                                </button>
                            </template>
                            <template x-if="!post.blog_webflow_item_id">
                                <button class="brand-button-primary text-xs font-medium px-3 py-1.5 rounded-lg hover:brand-button-primary transition brand-focus text-white"
                                        type="button"
                                        :disabled="isBusy(post)"
                                        :class="isBusy(post) ? 'opacity-60 cursor-wait' : ''"
                                        @click="publishNow(post.id)">
                                    <span x-text="isBusyFor(post, 'publish') ? 'Publishing…' : 'Publish Now'"></span>
                                </button>
                            </template>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </template>

    <div class="flex items-center justify-between px-6 py-3 bg-[#006AAB]/5">
        <span class="text-xs text-gray-500"
              x-text="posts.filter(p => p.blog_status === 'draft').length + ' draft(s) ready · ' + posts.filter(p => p.blog_status === 'scheduled').length + ' scheduled · ' + posts.filter(p => p.blog_status === 'pending').length + ' pending'"></span>
    </div>
</div>

<script>
function blogPanelComponent() {
    const BLOG_SCHEDULE_TIMEZONE = 'Europe/Berlin';
    const BLOG_SCHEDULE_DEFAULT_TIME = '09:00';

    return {
        posts: [],
        expanded: null,
        isGenerating: false,
        bulkAction: null,
        schedulePresets: [
            { key: 'hour', label: 'In 1 hour' },
            { key: 'tomorrow', label: 'Tomorrow 09:00' },
            { key: 'nextMonday', label: 'Next Monday 09:00' },
            { key: 'nextWeek', label: '+1 week' },
        ],
        calendarPostId: null,
        calendarMonth: '',
        calendarWeekdays: ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'],
        calendarTimeChips: ['06:00', '09:00', '12:00', '15:00', '18:00', '21:00'],
        calendarHourOptions: Array.from({ length: 24 }, (_value, hour) => String(hour).padStart(2, '0')),
        decoratePost(post) {
            const [date, time] = this.toLocalInput(post.blog_scheduled_at || post.blog_content?.publication_date).split('T');
            return {
                ...post,
                blogScheduleDate: date || '',
                blogScheduleTime: time || '',
                scheduleNote: '',
                scheduleError: '',
                busyAction: null,
                clientStatus: null,
                clientNote: '',
            };
        },
        initPosts(rawPosts) {
            this.posts = (rawPosts || []).map((post) => this.decoratePost(post));
            // The 15s batch-detail poll swaps this panel out of the DOM, which would
            // discard a schedule the user is still picking. Keep it parked while open.
            window.isBlogPanelEditing = () => this.expanded !== null;
        },
        findPost(postId) {
            return this.posts.find((post) => post.id === postId);
        },
        markScriptReview(detail) {
            const post = this.findPost(detail?.postId);
            if (!post) return;
            post.script_review_status = detail.status;
            if (detail.status === 'approved') {
                post.clientStatus = null;
                post.clientNote = '';
                if (post.blog_content?.error?.startsWith('Script not approved')) {
                    post.blog_content.error = null;
                }
            }
        },
        effectiveStatus(post) {
            return post?.clientStatus || post?.blog_status || 'pending';
        },
        isScriptApproved(post) {
            const seed = typeof post?.seed_data === 'string'
                ? (() => { try { return JSON.parse(post.seed_data); } catch (_) { return {}; } })()
                : (post?.seed_data || {});
            return (post?.script_review_status || seed.script_review_status) === 'approved';
        },
        statusLabel(post) {
            if (!this.isScriptApproved(post)) return 'Approve script first';
            const status = this.effectiveStatus(post);
            if (post?.busyAction === 'image') return 'Generating Image';
            if (post?.busyAction === 'schedule') return 'Scheduling';
            if (status === 'draft') return 'Draft Ready';
            if (status === 'published') return 'Published';
            if (status === 'scheduled') return 'Scheduled';
            if (status === 'generating') return 'Generating';
            if (status === 'publishing') return 'Publishing';
            if (status === 'failed') return 'Failed';
            return (status || '').charAt(0).toUpperCase() + (status || '').slice(1);
        },
        isBusy(post) {
            return Boolean(post?.busyAction);
        },
        isBusyFor(post, action) {
            return post?.busyAction === action;
        },
        setBusy(post, action, note) {
            if (!post) return;
            post.busyAction = action;
            if (action === 'publish') {
                post.clientStatus = 'publishing';
            } else if (action === 'schedule') {
                post.clientStatus = null;
            } else {
                post.clientStatus = 'generating';
            }
            post.clientNote = note || '';
            if (post.blog_content) {
                post.blog_content.error = null;
            }
        },
        clearBusy(post) {
            if (!post) return;
            post.busyAction = null;
            post.clientStatus = null;
        },
        flashNote(post, note) {
            if (!post) return;
            post.clientNote = note;
            window.setTimeout(() => {
                if (post.clientNote === note) {
                    post.clientNote = '';
                }
            }, 4000);
        },
        async readPayload(response) {
            return await response.json().catch(() => null);
        },
        toggleExpand(postId) {
            this.expanded = this.expanded === postId ? null : postId;
            window.batchDetailExpanded = !!this.expanded;
            this.closeCalendar();
        },
        // `publication_date` can arrive as an ISO timestamp or as free text the model
        // wrote (e.g. "10.08.2026"), so accept both before giving up on a prefill.
        parseScheduleValue(value) {
            if (!value) return null;
            if (value instanceof Date) return Number.isNaN(value.getTime()) ? null : value;
            const text = String(value).trim();
            // Check dd.mm.yyyy before Date(), which reads "01.09.2026" as 9 January.
            const german = text.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})(?:[,\s]+(\d{1,2}):(\d{2}))?/);
            if (german) {
                const [, day, month, year, hour, minute] = german;
                const localValue = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`
                    + `T${String(hour || '9').padStart(2, '0')}:${minute || '00'}`;
                return this.localValueToUtcDate(localValue);
            }
            const parsed = new Date(text);
            if (!Number.isNaN(parsed.getTime())) return parsed;
            return null;
        },
        toLocalInput(value) {
            const parsed = this.parseScheduleValue(value);
            if (!parsed) return '';
            if (typeof window.zoneDateToLocalValue === 'function') {
                return window.zoneDateToLocalValue(parsed, BLOG_SCHEDULE_TIMEZONE);
            }
            return String(value).slice(0, 16);
        },
        localValueToUtcDate(localValue) {
            if (!localValue) return null;
            const parsed = typeof window.zonedLocalValueToUtcDate === 'function'
                ? window.zonedLocalValueToUtcDate(localValue, BLOG_SCHEDULE_TIMEZONE)
                : new Date(localValue);
            if (!(parsed instanceof Date) || Number.isNaN(parsed.getTime())) return null;
            return parsed;
        },
        formatScheduled(value) {
            const parsed = this.parseScheduleValue(value);
            if (!parsed) return value ? String(value) : '';
            return parsed.toLocaleString('de-DE', {
                dateStyle: 'medium',
                timeStyle: 'short',
                timeZone: BLOG_SCHEDULE_TIMEZONE,
            });
        },
        todayDateValue() {
            return this.toLocalInput(new Date()).split('T')[0] || '';
        },
        // Noon UTC keeps the calendar date stable across any DST shift.
        dateValueShift(dateValue, days) {
            if (!dateValue) return '';
            const [year, month, day] = dateValue.split('-').map(Number);
            const shifted = new Date(Date.UTC(year, month - 1, day + days, 12));
            const pad = (part) => String(part).padStart(2, '0');
            return `${shifted.getUTCFullYear()}-${pad(shifted.getUTCMonth() + 1)}-${pad(shifted.getUTCDate())}`;
        },
        dateValueWeekday(dateValue) {
            const [year, month, day] = dateValue.split('-').map(Number);
            return new Date(Date.UTC(year, month - 1, day, 12)).getUTCDay();
        },
        scheduleLocalValue(post) {
            if (!post?.blogScheduleDate || !post?.blogScheduleTime) return '';
            return `${post.blogScheduleDate}T${post.blogScheduleTime.slice(0, 5)}`;
        },
        scheduleUtcDate(post) {
            return this.localValueToUtcDate(this.scheduleLocalValue(post));
        },
        scheduleIssue(post) {
            if (!post?.blogScheduleDate && !post?.blogScheduleTime) return 'Pick a date to schedule this post.';
            if (!post?.blogScheduleDate) return 'Pick a date.';
            if (!post?.blogScheduleTime) return 'Pick a time.';
            const scheduled = this.scheduleUtcDate(post);
            if (!scheduled) return 'That date and time are not valid.';
            if (scheduled.getTime() <= Date.now()) return 'Pick a time in the future.';
            return '';
        },
        canSchedule(post) {
            return Boolean(post?.id) && !this.isBusy(post) && !this.isGenerating && !this.scheduleIssue(post);
        },
        clearScheduleFeedback(post) {
            if (!post) return;
            post.scheduleNote = '';
            post.scheduleError = '';
        },
        onScheduleDateChange(post) {
            if (!post) return;
            this.clearScheduleFeedback(post);
            if (post.blogScheduleDate && !post.blogScheduleTime) {
                post.blogScheduleTime = BLOG_SCHEDULE_DEFAULT_TIME;
            }
        },
        onScheduleTimeChange(post) {
            if (!post) return;
            this.clearScheduleFeedback(post);
            if (!post.blogScheduleTime || post.blogScheduleDate) return;
            const today = this.todayDateValue();
            post.blogScheduleDate = today;
            // A time that already passed today means the user meant the next day.
            if (this.scheduleUtcDate(post)?.getTime() <= Date.now()) {
                post.blogScheduleDate = this.dateValueShift(today, 1);
            }
        },
        applySchedulePreset(post, key) {
            if (!post) return;
            this.clearScheduleFeedback(post);
            if (key === 'hour') {
                const [date, time] = this.toLocalInput(new Date(Date.now() + (60 * 60 * 1000))).split('T');
                post.blogScheduleDate = date || '';
                post.blogScheduleTime = time || BLOG_SCHEDULE_DEFAULT_TIME;
                return;
            }
            const today = this.todayDateValue();
            if (key === 'tomorrow') {
                post.blogScheduleDate = this.dateValueShift(today, 1);
                post.blogScheduleTime = BLOG_SCHEDULE_DEFAULT_TIME;
            } else if (key === 'nextMonday') {
                const weekday = this.dateValueWeekday(today);
                post.blogScheduleDate = this.dateValueShift(today, ((8 - weekday) % 7) || 7);
                post.blogScheduleTime = BLOG_SCHEDULE_DEFAULT_TIME;
            } else if (key === 'nextWeek') {
                post.blogScheduleDate = this.dateValueShift(post.blogScheduleDate || today, 7);
                post.blogScheduleTime = post.blogScheduleTime || BLOG_SCHEDULE_DEFAULT_TIME;
            }
            this.calendarMonth = (post.blogScheduleDate || today).slice(0, 7);
        },
        syncScheduleInputs(post, value) {
            const [date, time] = this.toLocalInput(value).split('T');
            if (!date) return;
            post.blogScheduleDate = date;
            post.blogScheduleTime = time || post.blogScheduleTime;
            this.calendarMonth = date.slice(0, 7);
        },
        scheduleDisplayLabel(post) {
            const scheduled = this.scheduleUtcDate(post);
            if (!scheduled) return 'Datum & Uhrzeit waehlen';
            return scheduled.toLocaleString('de-DE', {
                weekday: 'short',
                day: '2-digit',
                month: 'short',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                timeZone: BLOG_SCHEDULE_TIMEZONE,
            });
        },
        isCalendarOpen(post) {
            return Boolean(post?.id) && this.calendarPostId === post.id;
        },
        toggleCalendar(post) {
            if (!post?.id) return;
            if (this.calendarPostId === post.id) {
                this.closeCalendar();
                return;
            }
            this.clearScheduleFeedback(post);
            this.calendarMonth = (post.blogScheduleDate || this.todayDateValue()).slice(0, 7);
            this.calendarPostId = post.id;
        },
        closeCalendar() {
            this.calendarPostId = null;
        },
        activeCalendarMonth() {
            return this.calendarMonth || this.todayDateValue().slice(0, 7);
        },
        calendarMonthLabel() {
            const [year, month] = this.activeCalendarMonth().split('-').map(Number);
            return new Date(Date.UTC(year, month - 1, 1, 12)).toLocaleDateString('de-DE', {
                month: 'long',
                year: 'numeric',
                timeZone: 'UTC',
            });
        },
        calendarShiftMonth(delta) {
            const [year, month] = this.activeCalendarMonth().split('-').map(Number);
            const shifted = new Date(Date.UTC(year, month - 1 + delta, 1, 12));
            this.calendarMonth = `${shifted.getUTCFullYear()}-${String(shifted.getUTCMonth() + 1).padStart(2, '0')}`;
        },
        // Six fixed rows keep the popup from resizing as the user pages through months.
        calendarDays(post) {
            const [year, month] = this.activeCalendarMonth().split('-').map(Number);
            const leading = (new Date(Date.UTC(year, month - 1, 1, 12)).getUTCDay() + 6) % 7;
            const today = this.todayDateValue();
            const selected = post?.blogScheduleDate || '';
            const days = [];
            for (let offset = -leading; days.length < 42; offset += 1) {
                const cell = new Date(Date.UTC(year, month - 1, 1 + offset, 12));
                const value = `${cell.getUTCFullYear()}-${String(cell.getUTCMonth() + 1).padStart(2, '0')}-${String(cell.getUTCDate()).padStart(2, '0')}`;
                days.push({
                    value,
                    label: cell.getUTCDate(),
                    outside: cell.getUTCMonth() !== month - 1,
                    isToday: value === today,
                    isSelected: value === selected,
                    disabled: value < today,
                });
            }
            return days;
        },
        pickCalendarDay(post, value) {
            if (!post || !value) return;
            post.blogScheduleDate = value;
            this.calendarMonth = value.slice(0, 7);
            this.onScheduleDateChange(post);
        },
        pickCalendarTime(post, value) {
            if (!post || !value) return;
            post.blogScheduleTime = value;
            this.onScheduleTimeChange(post);
        },
        scheduleHour(post) {
            return (post?.blogScheduleTime || BLOG_SCHEDULE_DEFAULT_TIME).slice(0, 2);
        },
        scheduleMinute(post) {
            return (post?.blogScheduleTime || BLOG_SCHEDULE_DEFAULT_TIME).slice(3, 5);
        },
        // Five-minute steps, plus whatever odd minute a saved schedule already holds.
        calendarMinuteOptions(post) {
            const options = Array.from({ length: 12 }, (_value, step) => String(step * 5).padStart(2, '0'));
            const current = this.scheduleMinute(post);
            if (current && !options.includes(current)) {
                options.push(current);
                options.sort();
            }
            return options;
        },
        setScheduleHour(post, value) {
            this.pickCalendarTime(post, `${value}:${this.scheduleMinute(post)}`);
        },
        setScheduleMinute(post, value) {
            this.pickCalendarTime(post, `${this.scheduleHour(post)}:${value}`);
        },
        clearSchedulePick(post) {
            if (!post) return;
            post.blogScheduleDate = '';
            post.blogScheduleTime = '';
            this.clearScheduleFeedback(post);
        },
        async generateDraft(postId) {
            const post = this.findPost(postId);
            if (!postId || !post || this.isGenerating || this.isBusy(post)) return;
            if (!this.isScriptApproved(post)) {
                this.expanded = postId;
                this.flashNote(post, 'Approve the script before generating its blog draft.');
                return;
            }
            this.isGenerating = true;
            this.expanded = postId;
            this.setBusy(post, 'draft', 'Generating blog draft...');
            try {
                const response = await fetch('/blog/posts/' + postId + '/blog/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                });
                const payload = await this.readPayload(response);
                const errorMessage = payload?.data?.error || payload?.detail || payload?.message;
                if (!response.ok || payload?.ok === false || errorMessage) {
                    throw new Error(errorMessage || `Generate failed (${response.status})`);
                }
                post.blog_content = payload.data;
                post.blog_status = post.blog_scheduled_at ? 'scheduled' : 'draft';
                this.flashNote(post, 'Draft generated.');
            } catch (error) {
                console.error('Failed to generate blog draft', error);
                post.blog_status = 'failed';
                post.clientStatus = 'failed';
                post.clientNote = error instanceof Error ? error.message : 'Failed to generate blog draft';
                post.blog_content = { ...(post.blog_content || {}), error: post.clientNote };
                alert(post.clientNote);
            } finally {
                if (post.blog_status !== 'failed') {
                    this.clearBusy(post);
                } else {
                    post.busyAction = null;
                }
                this.isGenerating = false;
            }
        },
        async publishNow(postId) {
            const post = this.findPost(postId);
            if (!postId || !post || this.isGenerating || this.isBusy(post)) return;
            this.isGenerating = true;
            this.setBusy(post, 'publish', 'Publishing to Webflow...');
            try {
                const response = await fetch('/blog/posts/' + postId + '/blog/publish', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                });
                const payload = await this.readPayload(response);
                const errorMessage = payload?.detail || payload?.message;
                if (!response.ok || payload?.ok === false) {
                    throw new Error(errorMessage || `Publish failed (${response.status})`);
                }
                post.blog_status = payload.data.blog_status || 'published';
                post.blog_webflow_item_id = payload.data.webflow_item_id || post.blog_webflow_item_id;
                post.blog_published_at = payload.data.blog_published_at || post.blog_published_at;
                this.flashNote(post, 'Published to Webflow.');
            } catch (error) {
                console.error('Failed to publish blog post', error);
                post.blog_status = 'failed';
                post.clientStatus = 'failed';
                post.clientNote = error instanceof Error ? error.message : 'Failed to publish blog post';
                alert(post.clientNote);
            } finally {
                if (post.blog_status !== 'failed') {
                    this.clearBusy(post);
                } else {
                    post.busyAction = null;
                }
                this.isGenerating = false;
            }
        },
        async scheduleDraft(post) {
            if (!post?.id || this.isGenerating || this.isBusy(post)) return;
            const issue = this.scheduleIssue(post);
            if (issue) {
                post.scheduleNote = '';
                post.scheduleError = issue;
                return;
            }
            const scheduledDate = this.scheduleUtcDate(post);
            this.isGenerating = true;
            this.clearScheduleFeedback(post);
            this.setBusy(post, 'schedule', '');
            try {
                const response = await fetch('/blog/posts/' + post.id + '/blog/schedule', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ scheduled_at: scheduledDate.toISOString() }),
                });
                const payload = await this.readPayload(response);
                const errorMessage = payload?.detail || payload?.message;
                if (!response.ok || payload?.ok === false) {
                    throw new Error(errorMessage || `Schedule failed (${response.status})`);
                }
                post.blog_status = payload.data.blog_status || 'scheduled';
                post.blog_scheduled_at = payload.data.blog_scheduled_at;
                if (post.blog_content) {
                    post.blog_content.publication_date = payload.data.blog_scheduled_at;
                }
                this.syncScheduleInputs(post, post.blog_scheduled_at);
                this.closeCalendar();
                post.scheduleNote = 'Scheduled for ' + this.formatScheduled(post.blog_scheduled_at) + '.';
            } catch (error) {
                console.error('Failed to schedule blog post', error);
                post.scheduleError = error instanceof Error ? error.message : 'Failed to schedule blog post';
            } finally {
                this.clearBusy(post);
                this.isGenerating = false;
            }
        },
        async generateAllDrafts() {
            if (this.isGenerating) return;
            this.isGenerating = true;
            this.bulkAction = 'drafts';
            try {
                const response = await fetch('/blog/batches/{{ batch.id }}/blog/generate-all', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                });
                if (!response.ok) {
                    throw new Error(await response.text() || `Generate all failed (${response.status})`);
                }
                window.location.reload();
            } catch (error) {
                console.error('Failed to generate all blog drafts', error);
                alert(error instanceof Error ? error.message : 'Failed to generate all blog drafts');
            } finally {
                this.bulkAction = null;
                this.isGenerating = false;
            }
        },
        saveField(postId, field, value) {
            const body = {};
            body[field] = value;
            fetch('/blog/posts/' + postId + '/blog/content', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            }).then(resp => {
                if (!resp.ok) console.error('Failed to save blog field', field);
                const post = this.posts.find(p => p.id === postId);
                if (post && post.blog_content) {
                    post.blog_content[field] = value;
                    if (field === 'name' || field === 'title') {
                        post.blog_content.name = value;
                        post.blog_content.title = value;
                    }
                }
            });
        },
        async generateImage(post) {
            if (!post?.id || this.isGenerating || this.isBusy(post)) return;
            this.isGenerating = true;
            this.setBusy(post, 'image', 'Generating preview image...');
            try {
                const response = await fetch('/blog/posts/' + post.id + '/blog/image/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image_prompt: post.blog_content?.image_prompt || '' }),
                });
                const payload = await this.readPayload(response);
                const errorMessage = payload?.detail || payload?.message;
                if (!response.ok || payload?.ok === false) {
                    throw new Error(errorMessage || `Image generation failed (${response.status})`);
                }
                post.blog_content = {
                    ...(post.blog_content || {}),
                    image_prompt: payload.data.image_prompt,
                    preview_image_url: payload.data.preview_image_url,
                    image_model: payload.data.image_model,
                    image_generated_at: new Date().toISOString(),
                };
                this.flashNote(post, 'Preview image generated.');
            } catch (error) {
                console.error('Failed to generate blog image', error);
                post.clientStatus = 'failed';
                post.clientNote = error instanceof Error ? error.message : 'Failed to generate blog image';
                alert(post.clientNote);
            } finally {
                if (post.clientStatus !== 'failed') {
                    this.clearBusy(post);
                } else {
                    post.busyAction = null;
                }
                this.isGenerating = false;
            }
        },
        async regenerateImage(post) {
            return this.generateImage(post);
        },
        async removeImage(post) {
            if (!post?.id || this.isGenerating || this.isBusy(post)) return;
            this.isGenerating = true;
            this.setBusy(post, 'image', 'Removing preview image...');
            try {
                const response = await fetch('/blog/posts/' + post.id + '/blog/content', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ preview_image_url: null, image_prompt: post.blog_content?.image_prompt || null }),
                });
                const payload = await this.readPayload(response);
                const errorMessage = payload?.detail || payload?.message;
                if (!response.ok || payload?.ok === false) {
                    throw new Error(errorMessage || `Image removal failed (${response.status})`);
                }
                post.blog_content = {
                    ...(post.blog_content || {}),
                    preview_image_url: null,
                };
                this.flashNote(post, 'Preview image removed.');
            } catch (error) {
                console.error('Failed to remove blog image', error);
                alert(error instanceof Error ? error.message : 'Failed to remove blog image');
            } finally {
                this.clearBusy(post);
                this.isGenerating = false;
            }
        },
    };
}
</script>
{% endif %}
